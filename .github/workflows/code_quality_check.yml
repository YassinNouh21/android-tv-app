name: Check source code quality

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release-*'
  push:
    branches:
      - main
      - develop
      - 'release-*'
jobs:
  lint:
    name: Check lints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.27.1"

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Format check first, before build_runner produces generated files
      # that we don't want to format-gate on.
      - name: Verify formatting
        run: dart format --set-exit-if-changed . --line-length 120

      # Generate code (.mapper.dart, .g.dart) so analyze sees full sources.
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # Static analysis — fail only on errors (compile-level), not warnings/infos.
      # Pre-existing warnings/infos are tracked as tech debt; they shouldn't
      # block PRs on quality gates that weren't enforced before.
      - name: Analyze project source
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos
